name: Build Base Packages

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-src:
    name: Build Base Packages
    runs-on: ${{ matrix.RUNS_ON }}

    strategy:
      matrix:
        include:
          - ARCH: x86_64
            NODE_ARCH: x64
            RUNS_ON: ubuntu-latest
          # arm64 走 GitHub 公共 arm64 runner 原生构建，无需交叉编译
          - ARCH: arm64
            NODE_ARCH: arm64
            RUNS_ON: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Prepare
        run: echo "$(id -u), $(id -g)"

      - name: Build
        env:
          ACTION_MODE: 'true'
          WINE: 'false'
        run: |
          tools/build-with-docker.sh --arch ${{ matrix.NODE_ARCH }}

      - name: Compress Resources
        run: |
          set -ex
          mkdir -p tmp/src
          test -x electron/electron
          test -f resources/app.asar
          test -f resources/app.asar.unpacked/package.json
          test -x bin/node
          test -x resources/app.asar.unpacked/node_modules/wcc-exec/wcc
          test -x resources/app.asar.unpacked/node_modules/wcc-exec/wcsc
          rm -f electron/node electron/node.exe electron/node-18.exe
          tar -zcf tmp/src/src-linux.tar.gz bin electron resources tools

      - name: Compress nodegit
        run: |
          set -ex
          mkdir -p tmp/build
          test -f resources/app.asar.unpacked/node_modules/nodegit/build/Release/nodegit.node
          tar -zcf tmp/build/nodegit.tar.gz \
            -C resources/app.asar.unpacked/node_modules nodegit

      - name: Upload src artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-${{ matrix.ARCH }}.src
          path: tmp/src
          if-no-files-found: error
          compression-level: 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-${{ matrix.ARCH }}.build
          path: tmp/build
          if-no-files-found: error
          compression-level: 0
