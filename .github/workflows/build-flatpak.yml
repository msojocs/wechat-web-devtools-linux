name: Build Flatpak Installer Packages

on:
  workflow_call:

jobs:
  build-flatpak-installer:
    name: Build Flatpak Installer Packages
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ARCH: ['x86_64']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate TAG
        id: tag
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag='continuous'
          name='Continuous Build'
          if [[ "$IS_TAG" == 'true' ]]; then
            tag="$REF_NAME"
            name="$REF_NAME"
          fi
          echo "tag result: $tag - $name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Prepare system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder flatpak

      - name: Build
        env:
          ACTION_MODE: 'true'
          WINE: 'false'
        run: |
          mkdir -p tmp/build
          tools/build-prepare.sh
          tools/build-flatpak.sh "${{ steps.tag.outputs.tag }}" "${{ matrix.ARCH }}"
          tools/build-installer.sh "${{ steps.tag.outputs.tag }}" "${{ matrix.ARCH }}"
          # tar.gz / AppImage 已由 build-tar 任务产出并上传，这里只保留 .flatpak 和 _installer.sh，
          # 避免最终 release 出现同名附件冲突
          rm -f tmp/build/*.tar.gz tmp/build/*.AppImage
          ls -lh tmp/build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-flatpak-installer-${{ matrix.ARCH }}.build
          path: tmp/build
          if-no-files-found: error
          compression-level: 0
